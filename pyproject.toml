[project]
name = "sidekick"
version = "0.1.0"
description = "Self-evaluating autonomous AI agent built with LangGraph, LangChain, and Playwright"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "langchain>=1.2.17",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.2",
    "langchain-experimental>=0.4.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "openai>=2.34.0",
    "playwright>=1.59.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.54.0",
    "wikipedia>=1.4.0",
]
